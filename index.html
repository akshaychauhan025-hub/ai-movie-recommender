<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Movie Recommender</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background-color: #ffffff;
    color: #1a2f5a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #screen-signin {
    text-align: center;
    padding: 40px;
  }

  h1 {
    font-size: 42px;
    color: #e50914;
    margin-bottom: 10px;
  }

  p {
    color: #1a2f5a;
    margin-bottom: 30px;
    font-size: 16px;
  }

  input {
    display: block;
    width: 300px;
    padding: 14px;
    margin: 10px auto;
    background: #333;
    border: 1px solid #555;
    border-radius: 6px;
    color: white;
    font-size: 16px;
  }

  button {
    margin-top: 16px;
    padding: 14px 40px;
    background: #e50914;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover {
    background: #f40612;
  }
</style>
</head>
<body>

  <!-- SCREEN 1: SIGN IN -->
  <div id="screen-signin">
    <h1>🎬 AI Movie Recommender</h1>
    <p>Personalised picks powered by AI</p>
    <input type="text" id="user-name" placeholder="Your name">
    <input type="email" id="user-email" placeholder="Your email">
    <button onclick="signIn()">Get Started</button>
  </div>

  <!-- SCREEN 2: PREFERENCES -->
  <div id="screen-preferences" style="display:none;">
    <h2>What are you in the mood for?</h2>
  </div>

  <!-- SCREEN 3: RECOMMENDATIONS -->
  <div id="screen-recommendations" style="display:none;">
    <h2>Your Picks</h2>
  </div>

</body>
</html>
