<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Movie Recommender</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background-color: #ffffff;
    color: #1a2f5a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #screen-signin {
    text-align: center;
    padding: 40px;
  }

  h1 {
    font-size: 42px;
    color: #e50914;
    margin-bottom: 10px;
  }

  p {
    color: #1a2f5a;
    margin-bottom: 30px;
    font-size: 16px;
  }

  input {
    display: block;
    width: 300px;
    padding: 14px;
    margin: 10px auto;
    background: #333;
    border: 1px solid #555;
    border-radius: 6px;
    color: white;
    font-size: 16px;
  }

  button {
    margin-top: 16px;
    padding: 14px 40px;
    background: #e50914:
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
  }
button:hover {
    background: #f40612;
  }

  #screen-recommendations {
    padding: 40px;
    max-width: 800px;
    margin: 0 auto;
  }

  #screen-recommendations h2 {
    margin-bottom: 20px;
  }

  #rec-container {
    background: #f5f5f5;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }

  pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: Arial, sans-serif;
    font-size: 15px;
    line-height: 1.8;
  }
.rec-card {
    background: #f5f5f5;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .feedback-buttons {
    margin-top: 12px;
    display: flex;
    gap: 10px;
  }

  .btn-dislike {
    background: #e74c3c;
    padding: 8px 20px;
    font-size: 14px;
  }

  #returning-msg {
    background: #e8f4e8;
    border: 1px solid #27ae60;
    border-radius: 8px;
    padding: 14px 20px;
    margin-bottom: 20px;
    color: #1a5c2a;
    font-weight: bold;
    font-size: 15px;
  }
</style>
</head>
<body>

  <!-- SCREEN 1: SIGN IN -->
  <div id="screen-signin">
    <h1>🎬 AI Movie Recommender</h1>
    <p>Personalised picks powered by AI</p>
    <input type="text" id="user-name" placeholder="Your name">
    <input type="email" id="user-email" placeholder="Your email">
    <button onclick="signIn()">Get Started</button>
  </div>

  <!-- SCREEN 2: PREFERENCES -->
  <div id="screen-preferences" style="display:none;">
  <div id="returning-msg" style="display:none;"></div>
  <h2>What are you in the mood for?</h2>

  <div class="pref-group">
    <label>Who are you?</label>
    <select id="segment">
      <option value="genz">Gen Z</option>
      <option value="millennial">Millennial</option>
      <option value="genx">Gen X</option>
      <option value="family">Family</option>
    </select>
  </div>

  <div class="pref-group">
    <label>Language</label>
    <select id="language">
      <option value="bollywood">Bollywood</option>
      <option value="hollywood">Hollywood</option>
      <option value="korean">Korean</option>
      <option value="international">International</option>
    </select>
  </div>

  <div class="pref-group">
    <label>Genre</label>
    <select id="genre">
      <option value="thriller">Thriller</option>
      <option value="romantic">Romantic</option>
      <option value="comedy">Comedy</option>
      <option value="horror">Horror</option>
      <option value="scifi">Sci-Fi</option>
      <option value="drama">Drama</option>
    </select>
  </div>

  <div class="pref-group">
    <label>Mood today</label>
    <select id="mood">
      <option value="relaxed">Relaxed</option>
      <option value="excited">Excited</option>
      <option value="emotional">Emotional</option>
      <option value="laugh">Need a laugh</option>
    </select>
  </div>

  <div class="pref-group">
    <label>Tell us more (optional)</label>
    <textarea id="freetext" placeholder="e.g. Something like Inception but lighter..."></textarea>
  </div>

  <button onclick="getRecommendations()">Find My Match 🎬</button>
</div>

  <!-- SCREEN 3: RECOMMENDATIONS -->
  <div id="screen-recommendations" style="display:none;">
    <h2>Your Picks 🎬</h2>
    <div id="rec-container"></div>
    <button onclick="location.reload()">Start Again</button>
</div>
<script>
  var retryCount = 0;
  function validateInput(freetext) {
  var errors = [];
  if (freetext.trim() === '') return errors;
  if (freetext.length > 300) errors.push('Please keep your request under 300 characters.');
  var letterRatio = (freetext.match(/[a-zA-Z]/g) || []).length / freetext.length;
  if (letterRatio < 0.4) errors.push('That doesn\'t look like a valid request.');
  if (/(.)\1{6,}/.test(freetext)) errors.push('Please enter a meaningful request.');
  if (freetext.trim().length < 3) errors.push('Please enter at least 3 characters.');
  return errors;
}
  function signIn() {
    var name = document.getElementById('user-name').value;
    var email = document.getElementById('user-email').value;

    if (name === '' || email === '') {
      alert('Please enter your name and email');
      return;
    }

    localStorage.setItem('userName', name);
    localStorage.setItem('userEmail', email);

    var history = localStorage.getItem('userHistory_' + email);

    document.getElementById('screen-signin').style.display = 'none';
    document.getElementById('screen-preferences').style.display = 'block';

    if (history) {
      document.getElementById('returning-msg').style.display = 'block';
      document.getElementById('returning-msg').innerText = 'Welcome back ' + name + '! We remember your taste. Update preferences or go straight to your picks.';
    } else {
    document.getElementById('returning-msg').style.display = 'block';
    document.getElementById('returning-msg').innerText = 'Welcome ' + name + '! Tell us what you are in the mood for.';
    }
  }
async function getRecommendations(isRetry) {
  if (!isRetry) retryCount = 0;
    var segment = document.getElementById('segment').value;
    var language = document.getElementById('language').value;
    var genre = document.getElementById('genre').value;
    var mood = document.getElementById('mood').value;
    var freetext = document.getElementById('freetext').value;
  // INPUT VALIDATION
var inputErrors = validateInput(freetext);
if (inputErrors.length > 0) {
  alert('⚠️ ' + inputErrors[0]);
  return;
}

    document.getElementById('screen-preferences').style.display = 'none';
    document.getElementById('screen-recommendations').style.display = 'block';
    document.getElementById('rec-container').innerHTML = '<p>🤖 AI is finding your matches...</p>';

   var systemInstruction = `You are an expert movie recommendation engine. Your rules:
1. Only recommend real movies or shows that actually exist
2. Always personalise the reason to the specific user type and mood
3. Never recommend the same movie twice to the same user
4. You MUST format every response exactly like this with no introduction text:
MOVIE 1: [Title] ([Year])
WHY: [reason]
RATING: [X/10]
MOVIE 2: [Title] ([Year])
WHY: [reason]
RATING: [X/10]
Start directly with MOVIE 1. No introduction. No summary at the end.
5. Always recommend exactly 5 movies, no more, no less`;

var email = localStorage.getItem('userEmail');
var historyRaw = localStorage.getItem('userHistory_' + email);
var historyContext = '';

if (historyRaw) {
    var history = JSON.parse(historyRaw);
    var liked = history.filter(h => h.type === 'like').map(h => 'Movie index ' + h.index);
    var disliked = history.filter(h => h.type === 'dislike').map(h => 'Movie index ' + h.index);
    historyContext = '\n- Previously liked: ' + (liked.length ? liked.join(', ') : 'none');
    historyContext += '\n- Previously disliked: ' + (disliked.length ? disliked.join(', ') : 'none') + '. Do NOT recommend these again.';
}

var userPrompt = `Recommend 5 movies for this user:
- User type: ${segment}
- Language preference: ${language}
- Genre: ${genre}
- Mood: ${mood}
- Additional request: ${freetext}${historyContext}`;

var response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer 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',
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
                { role: 'system', content: systemInstruction },
                { role: 'user', content: userPrompt }
            ]
        })
    });

    var data = await response.json();
   var text = data.choices ? data.choices[0].message.content.trim() : JSON.stringify(data);
  console.log('AI raw response:', text);
  var validationErrors = validateRecommendations(text);
if (validationErrors.length > 0) {
    console.log('Guardrail triggered:', validationErrors);
  retryCount++;
if (retryCount < 3) {
    document.getElementById('rec-container').innerHTML = '<p style="color:orange;">⚠️ Improving your recommendations... (Attempt ' + retryCount + ' of 3)</p>';
    setTimeout(function() { getRecommendations(true); }, 2000);
} else {
    document.getElementById('rec-container').innerHTML = '<p style="color:red;">⚠️ We could not get good recommendations right now. Please try again.</p>';
}
    return;
}
  console.log('Validation ran. Errors found:', validationErrors.length);
  var formatResult = scoreFormat(text);
console.log('Format Score:', formatResult.score + '/100');
console.log('Breakdown:', formatResult.breakdown);
    var formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
var recommendations = formatted.split('MOVIE ').filter(r => r.trim() !== '');
var html = '';
recommendations.forEach(function(rec, index) {
    html += '<div class="rec-card">';
    html += '<p>' + rec + '</p>';
    html += '<div class="feedback-buttons">';
    html += '<button class="btn-like" onclick="saveFeedback(' + index + ', \'like\')">👍 Great pick</button>';
    html += '<button class="btn-dislike" onclick="saveFeedback(' + index + ', \'dislike\')">👎 Not for me</button>';
    html += '</div>';
    html += '</div>';
});
document.getElementById('rec-container').innerHTML = html;
}
  function saveFeedback(index, type) {
    var email = localStorage.getItem('userEmail');
    var history = JSON.parse(localStorage.getItem('userHistory_' + email) || '[]');
    history.push({ index: index, type: type, timestamp: new Date().toISOString() });
    localStorage.setItem('userHistory_' + email, JSON.stringify(history));
    
    if (type === 'like') {
        alert('👍 Great! We will show you more like this.');
    } else {
        alert('👎 Noted! We will improve your picks.');
    }
}
  function validateRecommendations(text) {
    var errors = [];

    // Check 1 — did AI return exactly 5 movies?
    var movieCount = (text.match(/MOVIE \d/g) || []).length;
    if (movieCount < 5) {
        errors.push('AI returned ' + movieCount + ' movies instead of 5.');
    }

    // Check 2 — does each movie have a year?
    var years = text.match(/\(\d{4}\)/g) || [];
    if (years.length < movieCount) {
        errors.push('Some movies are missing a year.');
    }

    // Check 3 — are years realistic?
    years.forEach(function(year) {
        var y = parseInt(year.replace(/[()]/g, ''));
        if (y < 1950 || y > 2025) {
            errors.push('Suspicious year detected: ' + year + '. Possible hallucination.');
        }
    });

    // Check 4 — does response follow format?
    if (!text.includes('WHY:') || !text.includes('RATING:')) {
        errors.push('AI did not follow the required format.');
    }

    return errors;
}
  function scoreFormat(text) {
  var score = 0;
  var breakdown = [];

  // 1. Exactly 5 movies
  var movieCount = (text.match(/MOVIE \d/g) || []).length;
  if (movieCount === 5) {
    score += 20;
    breakdown.push('✅ 5 movies returned (+20)');
  } else {
    breakdown.push('❌ ' + movieCount + ' movies returned (+0)');
  }

  // 2. All movies have a year
  var years = text.match(/\(\d{4}\)/g) || [];
  if (years.length >= 5) {
    score += 20;
    breakdown.push('✅ All years present (+20)');
  } else {
    breakdown.push('❌ Only ' + years.length + ' years found (+0)');
  }

  // 3. Years are realistic
  var badYears = years.filter(function(y) {
    var yr = parseInt(y.replace(/[()]/g, ''));
    return yr < 1950 || yr > 2025;
  });
  if (badYears.length === 0) {
    score += 20;
    breakdown.push('✅ All years realistic (+20)');
  } else {
    breakdown.push('❌ Suspicious years: ' + badYears.join(', ') + ' (+0)');
  }

  // 4. WHY present for each movie
  var whyCount = (text.match(/WHY:/g) || []).length;
  if (whyCount >= 5) {
    score += 20;
    breakdown.push('✅ All WHY: present (+20)');
  } else {
    breakdown.push('❌ Only ' + whyCount + ' WHY: found (+0)');
  }

  // 5. RATING present for each movie
  var ratingCount = (text.match(/RATING:/g) || []).length;
  if (ratingCount >= 5) {
    score += 20;
    breakdown.push('✅ All RATING: present (+20)');
  } else {
    breakdown.push('❌ Only ' + ratingCount + ' RATING: found (+0)');
  }

  return { score: score, breakdown: breakdown };
}
</script>
</body>
</html>
